<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 여행 계획</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:#0f172a;color:#e2e8f0;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.wrap{max-width:420px;width:100%;text-align:center}
h1{font-size:28px;font-weight:800;margin-bottom:4px}
.sub{font-size:14px;color:#94a3b8;margin-bottom:32px}
.card{
  display:block;text-decoration:none;color:inherit;
  border-radius:20px;padding:28px 24px;margin-bottom:16px;
  transition:transform .2s, box-shadow .2s;
  text-align:left;position:relative;overflow:hidden;
}
.card:active{transform:scale(0.98)}
.card-dalian{
  background:linear-gradient(135deg,#0077b6,#00b4d8,#0ea5e9);
  box-shadow:0 8px 32px rgba(0,119,182,0.3);
}
.card-yunnan{
  background:linear-gradient(135deg,#92400e,#b45309,#d97706);
  box-shadow:0 8px 32px rgba(146,64,14,0.3);
}
.card-icon{font-size:40px;margin-bottom:10px}
.card-title{font-size:22px;font-weight:800;margin-bottom:4px}
.card-info{font-size:13px;opacity:0.85;line-height:1.6}
.card-arrow{
  position:absolute;right:20px;top:50%;transform:translateY(-50%);
  font-size:24px;opacity:0.6;
}
.footer{margin-top:32px;font-size:11px;color:#475569}
</style>
</head>
<body>
<div class="wrap">
  <h1>2026 여행</h1>
  <p class="sub">계획표를 선택하세요</p>

  <a class="card card-dalian" href="%EB%8B%A4%EB%A1%A4%EC%97%AC%ED%96%89%EA%B3%84%ED%9A%8D%ED%91%9C.html">
    <div class="card-icon">🌊</div>
    <div class="card-title">大连 · 다롄</div>
    <div class="card-info">
      2026.07.29 — 08.01 · 3박 4일<br>
      가족 3명 · 금석탄 · 뤼순 · 시내 관광
    </div>
    <div class="card-arrow">›</div>
  </a>

  <a class="card card-yunnan" href="yunnan_guilin_final_itinerary_2026.html">
    <div class="card-icon">🏔️</div>
    <div class="card-title">云南 · 桂林 · 阳朔</div>
    <div class="card-info">
      2026.11.07 — 11.21 · 14박 15일<br>
      쿤밍 · 다리 · 리장 · 호도협 · 옥룡설산 · 구이린 · 양숴
    </div>
    <div class="card-arrow">›</div>
  </a>

  <div class="footer">Suji's Travel Plans</div>
</div>
</body>
</html>
